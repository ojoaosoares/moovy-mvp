version: "3.9"

services:
  db:
    image: postgres:15
    container_name: moovy-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: moovydatabase
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis:alpine
    container_name: redis-moovy
    ports:
      - "6379:6379"

volumes:
  postgres_data:
